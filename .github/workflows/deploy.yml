name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one deploy at a time, so two pushes can't copy files over each other
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Vite bakes VITE_* values into the built files at build time
      - name: Build React App
        run: npm run build
        env:
          VITE_EMAIL: ${{ secrets.VITE_EMAIL }}
          VITE_LINKEDIN_URL: ${{ secrets.VITE_LINKEDIN_URL }}
          VITE_GITHUB_URL: ${{ secrets.VITE_GITHUB_URL }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_RECEIVE_EMAIL: ${{ secrets.VITE_EMAILJS_RECEIVE_EMAIL }}

      - name: Set up SSH Key
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy Build to Apache (rsync over SSH)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -az --delete \
            --chmod=D755,F644 \
            --rsync-path="sudo rsync" \
            -e "ssh -i ~/.ssh/ec2_key" \
            dist/ "$EC2_USER@$EC2_HOST:/var/www/html/"
